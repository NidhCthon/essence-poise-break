<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Poise &amp; Break preview</title>
<!-- Foundry's own stylesheet and fonts, copied from a licensed install into
     .foundry/ and never committed. Without them the page still renders, just
     less like Foundry. -->
<link rel="stylesheet" href=".foundry/css/foundry2.css">
<link rel="stylesheet" href="../../styles/turn-panel.css">
<link rel="stylesheet" href="../../styles/cut-in.css">
<link rel="stylesheet" href="../../styles/anima-flare.css">
<link rel="stylesheet" href="../../styles/finisher.css">
<link rel="stylesheet" href="../../styles/splash.css">
<style>
  html, body { height: auto !important; overflow: auto !important; }
  body { margin: 0; padding: 24px; background: #0c0b11; color: #e8e6df; font-family: "Signika", sans-serif; }
  body.theme-light { background: #cfccc2; color: #191813; }
  .preview-title { font-family: "Modesto Condensed", sans-serif; font-size: 24px; margin: 0 0 12px; letter-spacing: .02em; }
  .preview-row { display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-start; margin-bottom: 30px; }
  .preview-caption { font-size: 12px; opacity: .7; margin: 0 0 6px; }
  .preview-frame.application { position: relative !important; inset: auto !important; width: 360px; max-height: none; }
  .preview-bar { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
  .preview-bar a, .preview-bar button { color: inherit; font: inherit; font-size: 13px; }
  canvas { border-radius: 6px; display: block; }
  .preview-cutin { position: relative; width: 520px; height: 260px; overflow: hidden; border-radius: 6px; background: #2f332c; }
</style>
<script src="https://cdn.jsdelivr.net/npm/pixi.js@7.4.3/dist/pixi.min.js"></script>
</head>
<body class="theme-dark">
  <div class="preview-bar">
    <a href="?theme=dark">Dark</a> · <a href="?theme=light">Light</a>
    <button type="button" id="replay">Replay the Break</button>
    <button type="button" id="replay-cutin">Replay the cut-in</button>
    <button type="button" id="replay-splash">Replay the splash</button>
    <button type="button" id="replay-flare">Replay the flare</button>
    <button type="button" id="replay-impact">Replay the impact (on the aura)</button>
    <button type="button" id="replay-defeat">Replay the drain (on the aura)</button>
  </div>
  <h1 class="preview-title">Panel</h1>
  <div class="preview-row" id="panels"></div>
  <h1 class="preview-title">Break effect</h1>
  <div class="preview-row" id="effect"></div>
  <h1 class="preview-title">Round splash</h1>
  <div class="preview-row" id="splash"></div>
  <h1 class="preview-title">VICTORY / DEFEAT</h1>
  <div class="preview-row" id="finale"></div>
  <h1 class="preview-title">Decisive cut-in</h1>
  <div class="preview-row" id="cutin"></div>
  <h1 class="preview-title">Anima flare</h1>
  <div class="preview-row" id="flare"></div>
  <div class="preview-row" id="flare-caption"></div>
  <h1 class="preview-title">Poise numbers</h1>
  <div class="preview-row" id="poise-numbers"></div>
  <h1 class="preview-title">DEFEATED</h1>
  <div class="preview-row" id="defeat"></div>
  <h1 class="preview-title">Bonfire aura</h1>
  <div class="preview-row" id="aura"></div>
  <h1 class="preview-title">Anima colours</h1>
  <div id="anima-colors"></div>
  <h1 class="preview-title">Charm callouts</h1>
  <div class="preview-row" id="callouts"></div>
  <h1 class="preview-title">Gambit callouts</h1>
  <div class="preview-row" id="gambit-callouts"></div>
  <h1 class="preview-title">Miss callouts</h1>
  <div class="preview-row" id="miss-callouts"></div>
  <script type="module" src="preview.mjs"></script>
</body>
</html>
